# yaml-language-server: $schema=https://sap.github.io/ui5-tooling/schema/ui5.yaml.json

specVersion: "2.5"
metadata:
  name: htgapp
type: application
builder:
  resources:
    excludes:
      - /test/**
      - /localService/**
  customTasks:
    - name: deploy-to-abap
      afterTask: generateCachebusterInfo
      configuration:
        target:
          url: https://sap1.edugate.web.id:8028
          client: "388"
        app:
          name: ZHTG_APP
          description: Edu Building Maintenance App
          package: $tmp
          transport: ""
