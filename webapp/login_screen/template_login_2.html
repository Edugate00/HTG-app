    @Html.Raw(sys_script_generated)

    @Html.Raw(custom_script)
    <script>
        (function () {
            var needActivation = true;
            function frameActivate() {
                var antiClickjack = document.getElementById("antiClickjack");
                if (antiClickjack) {
                    antiClickjack.parentNode.removeChild(antiClickjack);
                }
            }
            function registerHandler() {
                if (window.addEventListener) {
                    window.addEventListener("message", handleMessage);
                }
                else if (window.attachEvent) {
                    window.attachEvent("onmessage", handleMessage);
                }
            }
            function unregisterHandler() {
                if (window.removeEventListener) {
                    window.removeEventListener("message", handleMessage);
                }
                else if (window.detachEvent) {
                    window.detachEvent("onmessage", handleMessage);
                }
            }
            function handleMessage(event) {
                var origin = window.location.protocol + "//" + window.location.host;
                if (event.source && (event.source !== window.parent)) {
                    return;
                }
                if (event.origin === origin) {
                    frameActivate();
                    unregisterHandler();
                }
            }
            try {
                if ((top === self) || (top.location.href)) {
                    needActivation = false;
                    frameActivate();
                }
            }
            catch (e) {
            }
            if (needActivation) {
                registerHandler();
                // Portal support: hosting page has same origin but performed domain relaxation
                window.parent.postMessage("ClickJackProt:", "*");
                window.parent.postMessage("SAPFramingControl:", "*");
            }
        }());
    </script>
    <style>
        :root {
            --primary-color-10: #e0f1ef;
            --primary-color-20: #92d0c5;
            --primary-color-30: #54b597;
            --primary-color-40: #00925D;
            --primary-color-50: #004d29;
            --primary-color-60: #00210b;
            --secondary-color-10: #f0e9fa;
            --secondary-color-20: #c7b2ed;
            --secondary-color-30: #9a83e3;
            --secondary-color-40: #5d41d4;
            --secondary-color-50: #2e2576;
            --secondary-color-60: #0e1234;
            --accent-color-10: #fff8e5;
            --accent-color-20: #ffe1a6;
            --accent-color-30: #ffbf72;
            --accent-color-40: #FF942E;
            --accent-color-50: #8a4316;
            --accent-color-60: #3f1206;
            --neutral-color-10: #EAEAEA;
            --neutral-color-20: #ADADAD;
            --neutral-color-30: #747474;
            --neutral-color-40: #333333;
            --neutral-color-50: #1A1A1A;
            --danger-color-10: #fce7e0;
            --danger-color-20: #f5a992;
            --danger-color-30: #ef6454;
            --danger-color-40: #e80b00;
            --danger-color-50: #7b0300;
            --danger-color-60: #350000;
        }

        * {
            padding: 0;
            margin: 0;
            box-sizing: border-box;
        }

        body {
            height: 100vh;
        }

        .main-container {
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: row-reverse;
            font-family: Arial, Helvetica, sans-serif;
        }

        .hero-img {
            display: block;
            width: 50%;
            height: 100%;
            object-fit: cover;
        }

        #LOGIN_PAGE {
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        #LOGIN_FORM {
            width: 75%;
            height: 100%;
            /* padding: 96px; */
            display: flex;
            flex-direction: column;
            justify-content: center;
            gap: 28px;
        }

        #header {
            width: 100%;
            padding: 16px;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        #header>img {
            width: 64px;
            height: 64px;
            object-fit: contain;
        }

        .loginInputBlock {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .field-container {
            width: 100%;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .input-field-container {
            width: 100%;
        }

        .input-field {
            width: 100%;
            padding: 8px;
            color: var(--neutral-color-50);
            font-size: 18px;
            border-radius: 8px;
            border: 1px solid var(--neutral-color-20);
            outline: none;
        }

        .input-field:focus {
            color: var(--neutral-color-50);
            background-color: #f8f8f8;
            border: 1px solid var(--primary-color-40);
            outline: 3.6px solid #54b59659;
        }

        .input-field:disabled {
            color: var(--neutral-color-30);
            background-color: var(--neutral-color-10);
            border: 1px solid var(--neutral-color-20);
            outline: none;
        }

        .langAndClientBlock {
            width: 100%;
            display: flex;
            gap: 20px;
        }

        .buttonBlock {
            width: 100%;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .btn-primary-solid {
            width: 100%;
            padding: 8px;
            font-size: 18px;
            border-radius: 8px;
            border: none;
            color: white;
            background-color: var(--primary-color-40);
        }

        .btn-primary-outline {
            width: 100%;
            padding: 8px;
            font-size: 18px;
            border-radius: 8px;
            border: 1px solid var(--primary-color-40);
            color: var(--primary-color-40);
            background-color: white;
        }

        .btn-primary-ghost {
            width: 100%;
            padding: 8px;
            font-size: 18px;
            border-radius: 8px;
            border: none;
            color: var(--primary-color-40);
            background-color: white;
        }

        .btn-primary-solid:hover {
            background-color: #017c4f;
            cursor: pointer;
        }

        .btn-primary-outline:hover,
        .btn-primary-ghost:hover {
            background-color: var(--primary-color-10);
            cursor: pointer;
        }

        .messageError {
            padding: 8px;
            border-radius: 8px;
            color: var(--danger-color-40);
            background-color: var(--danger-color-10);
        }

        @media only screen and (max-width: 992px) {
            #LOGIN_FORM {
                width: 75%;
                /* padding: 56px; */
            }
        }

        @media only screen and (max-width: 768px) {
            /* .main-container {
                flex-direction: column;
            }

            .hero-img {
                display: none;
            }

            #LOGIN_PAGE {
                width: 100%;
                height: 100%;
                display: flex;
                flex-direction: column;
                align-items: center;
            } */

            #LOGIN_FORM {
                width: 75%;
                /* padding: 56px; */
            }
        }

        @media only screen and (max-width: 576px) {
            #LOGIN_FORM {
                width: 75%;
                /* padding: 24px; */
            }
        }
    </style>
</head>

                    </div>

                            <div id="PASSWORD_FIELD" class="input-field-container">

                            </div>
                        </div>
                        <div id="CLIENT_BLOCK" class="field-container" @Html.Raw(sys_form_client_state)
                            onclick="fioriLogin.setInputFocus('CLIENT_FIELD-inner')">
                            <label for="CLIENT_LABEL-inner" id="CLIENT_LABEL" class="input-label"
                                onclick="fioriLogin.setInputFocus('CLIENT_FIELD-inner')">@label_client</label>
                            <div id="PASSWORD_FIELD" class="input-field-container">
                                <input id="CLIENT_FIELD-inner" tabindex="4" type="text" value="@sys_form_default_client"
                                    maxlength="3" size="3" class="input-field" name="@sys_form_param_client"
                                    inputmode="verbatim" disabled />
                            </div>
                        </div>
                    </div> -->
                </div>

                <div class="buttonBlock">
                    <div class="sapUiSraMessageContainer">

                            <label id="LOGIN_LBL_ERROR" class="sapThemeText">@Html.Raw(sys_messages_text)</label>
                        </div>

                    <button type="submit" id="LOGIN_LINK" tabindex="6" class="btn-primary-solid"
